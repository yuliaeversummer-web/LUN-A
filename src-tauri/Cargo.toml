[package]
name = "lunea"
version = "0.1.0"
description = "LUNÉA Audio Control"
authors = ["LUNÉA"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "lunea_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-autostart = "2"

[target."cfg(windows)".dependencies]
base64 = "0.22"
png = "0.18"
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_Devices_FunctionDiscovery", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Media_Audio_Endpoints", "Media_Control", "Foundation_Collections", "Storage_Streams", "Win32_System_WinRT", "Graphics_Imaging", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_UI_Input_KeyboardAndMouse"] }
windows-core = "0.62.2"
windows-future = "0.3.2"


